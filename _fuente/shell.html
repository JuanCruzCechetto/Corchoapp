<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corcho App</title>
<meta name="description" content="Tareas, hábitos, enfoque, entrenos, estudio, finanzas y recordatorios en una sola app.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Corcho">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-jc3.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180-jc3.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
html{background:#000}
#splash{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:46px;transition:opacity .45s ease,visibility 0s linear .45s}
#splash.out{opacity:0;visibility:hidden}
#splash .sp-logo{width:132px;height:auto;display:block}
#splash .sp-spin{width:28px;height:28px;display:block;animation:corchoSpin .9s linear infinite}
#splash .sp-spin circle{fill:none;stroke:#E2B84A;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:80 200}
#splash .sp-spin .tr{stroke:#E2B84A;opacity:.15;stroke-dasharray:none}
@keyframes corchoSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#splash .sp-spin{animation-duration:2.4s}}
</style>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap"></noscript>
<style>
/*APP_CSS*/
</style>
</head>
<body>
<div id="splash" role="status" aria-label="Cargando Corcho"><svg class="sp-logo" viewBox="84 104 344 288" aria-hidden="true"><path d="M196 150V310A46 46 0 0 1 104 310" fill="none" stroke="#F4F4F5" stroke-width="40" stroke-linecap="round"/><path d="M353.6 337.0A70 70 0 1 1 353.6 247.0" fill="none" stroke="#F4F4F5" stroke-width="40" stroke-linecap="round"/><path d="M352 124H398L374 154Q404 152 406 178Q406 206 378 206Q360 206 352 196" fill="none" stroke="#E2B84A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="sp-spin" viewBox="0 0 50 50" aria-hidden="true"><circle class="tr" cx="25" cy="25" r="20"/><circle cx="25" cy="25" r="20"/></svg></div>
<header class="topbar"><button class="menubtn" data-act="menu" aria-label="Abrir menú" aria-controls="sideMenu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h11"/></svg><span class="badge" data-badge="menu" hidden></span></button><div class="brand"><svg class="brand-mark" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#0C0C0E" stroke="#26262B" stroke-width="10"/><path d="M196 150V310A46 46 0 0 1 104 310" fill="none" stroke="#F4F4F5" stroke-width="40" stroke-linecap="round"/><path d="M353.6 337.0A70 70 0 1 1 353.6 247.0" fill="none" stroke="#F4F4F5" stroke-width="40" stroke-linecap="round"/><path d="M352 124H398L374 154Q404 152 406 178Q406 206 378 206Q360 206 352 196" fill="none" stroke="#E2B84A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Corcho</b></div><span class="grow"></span><button class="sync-ic" data-go="ajustes" aria-label="Sincronización"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18.5h10.5a4 4 0 0 0 .6-8 6 6 0 0 0-11.6-1.4A4.5 4.5 0 0 0 7 18.5z"/></svg></button></header>
<div class="scrim" data-act="menuClose"></div>
<div class="app">
  <aside class="side" id="sideMenu" aria-label="Secciones">
    <div class="brand"><svg class="brand-mark" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#0C0C0E" stroke="#26262B" stroke-width="10"/><path d="M196 150V310A46 46 0 0 1 104 310" fill="none" stroke="#F4F4F5" stroke-width="40" stroke-linecap="round"/><path d="M353.6 337.0A70 70 0 1 1 353.6 247.0" fill="none" stroke="#F4F4F5" stroke-width="40" stroke-linecap="round"/><path d="M352 124H398L374 154Q404 152 406 178Q406 206 378 206Q360 206 352 196" fill="none" stroke="#E2B84A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Corcho</b><button class="x side-close" data-act="menuClose" aria-label="Cerrar menú">×</button></div>
    <nav id="sideNav"></nav>
    <span class="grow"></span><button class="sync-ic" data-go="ajustes" aria-label="Sincronización"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18.5h10.5a4 4 0 0 0 .6-8 6 6 0 0 0-11.6-1.4A4.5 4.5 0 0 0 7 18.5z"/></svg></button>
  </aside>
  <main class="main">
    <div class="wrap">
      <section class="view" id="v-hoy"></section>
      <section class="view" id="v-tareas" hidden></section>
      <section class="view" id="v-habitos" hidden></section>
      <section class="view" id="v-enfoque" hidden></section>
      <section class="view" id="v-entreno" hidden></section>
      <section class="view" id="v-estudio" hidden></section>
      <section class="view" id="v-finanzas" hidden style="--mc:var(--m-finanzas)">
        <div class="vhead">
          <div><h1 class="vtitle">Finanzas</h1><div class="vsub" id="dayinfo"></div></div>
          <div class="month-nav">
            <button class="iconbtn" id="prevM" aria-label="Mes anterior">‹</button>
            <span class="label" id="mLabel"></span>
            <button class="iconbtn" id="nextM" aria-label="Mes siguiente">›</button>
          </div>
        </div>
        <span id="storePill" hidden></span>
        <nav class="seg" id="finTabs" role="tablist">
          <button role="tab" data-tab="resumen" aria-selected="true" id="t-resumen">Resumen</button>
          <button role="tab" data-tab="movs" aria-selected="false" id="t-movs">Movimientos</button>
          <button role="tab" data-tab="pagos" aria-selected="false" id="t-pagos">Por pagar</button>
          <button role="tab" data-tab="ajustes" aria-selected="false" id="t-ajustes">Presupuesto</button>
        </nav>
<!--FIN_HTML-->
        <section id="p-pagos" hidden></section>
      </section>
      <section class="view" id="v-recordatorios" hidden></section>
      <section class="view" id="v-ajustes" hidden></section>
    </div>
  </main>
</div>
<nav class="bottombar" id="bottomNav" aria-label="Secciones"></nav>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="x" data-act="close" aria-label="Cerrar" style="font-size:22px">×</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="firebase-config.js"></script>
<script>
/*SYNC_JS*/
</script>
<script>
try{var ks=Object.keys(localStorage);if(!localStorage.getItem("corcho:fin:config")&&!ks.some(function(k){return k.indexOf("corcho:fin:mes:")===0})){ks.forEach(function(k){if(k==="ldc:config")localStorage.setItem("corcho:fin:config",localStorage.getItem(k));else if(k.indexOf("ldc:mes:")===0)localStorage.setItem("corcho:fin:mes:"+k.slice(8),localStorage.getItem(k))})}}catch(e){}
</script>
<script>
/*FIN_JS*/
</script>
<script>
/*APP_JS*/
</script>
<script>if("serviceWorker" in navigator&&location.protocol!=="file:"){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
